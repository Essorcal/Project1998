name: Workflow tooling

on:
  pull_request:
    paths:
      - 'Scripts/workflow.py'
      - 'Scripts/test_workflow.py'
      - 'Scripts/Workflow.ps1'
      - 'Scripts/Prep-WorkerClone.ps1'
      - '.github/workflows/workflow-tooling.yml'
  push:
    branches: [master, main]
    paths:
      - 'Scripts/workflow.py'
      - 'Scripts/test_workflow.py'
      - 'Scripts/Workflow.ps1'
      - 'Scripts/Prep-WorkerClone.ps1'
      - '.github/workflows/workflow-tooling.yml'

permissions:
  contents: read

jobs:
  offline-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python Scripts/test_workflow.py
