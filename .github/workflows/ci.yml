name: build / test / deploy

# The pipeline has two lanes, decided by WHAT changed (see the `changes` job):
#
#   code    -> publish, stage a new release on the host, schedule a warned restart
#   content -> mirror game-data/ and @reload; no restart, nobody gets kicked
#
# Content is by far the more common change, and it is hot-reloadable (Content.Load / @reload), so treating
# every push as "restart the world" would be both wrong and rude.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      restart_delay_minutes:
        description: "Minutes of warning before the restart (0 = restart as soon as it lands)"
        required: false
        default: "3"

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # ---------------------------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.changes.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the lane check below diffs against github.event.before.
          fetch-depth: 0

      # The deploy job's superseded check, run against a stubbed gh on every push and pull request, so a change
      # that would let it skip without proof goes red here rather than on a deploy. Bash only: 1.7 s on the runner.
      - name: Deploy guard harness
        run: bash Tests/DeployGuard/superseded-guard.test.sh

      - name: Which lane is this?
        id: changes
        run: |
          # A first push (or a force-push that rewrote history) has no usable "before" commit; treat it as a
          # code change so the safe/complete lane runs rather than silently shipping data only.
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit — running the full code lane."
            exit 0
          fi
          # Content lives at game-data/. A push that touches nothing else is hot-reloadable, so it takes the
          # content lane. Anything outside that prefix -- one .cs file, one .csproj -- forces the code lane.
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qvE '^game-data/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Content-only push (game-data/ only) — hot reload, no restart."
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Project1998.Server.slnf is the full solution minus MapEditor: a net8.0-windows WinForms/WebView2
      # desktop tool that cannot run on this runner and has no business costing it a Windows-targeting restore.
      # Everything that ships, plus Tests and the probes, is in the filter. Directory.Build.props makes
      # warnings errors, so a green build here is a warning-free build.
      - name: Restore
        run: dotnet restore Project1998.Server.slnf

      - name: Build
        run: dotnet build Project1998.Server.slnf -c Release --no-restore

      # The real gate. `dotnet build` cannot see a bad CSV row, a renamed Lua verb, or a missing .map file —
      # see Tests/ContentSmokeTests.cs for why each of those is a silent failure rather than a loud one.
      - name: Content smoke test
        run: dotnet test Tests/Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      # linux-x64 because the host is an OVH VPS (x86). Nothing in the source is architecture-specific:
      # MoonSharp and BCrypt.Net-Next are pure managed, and Microsoft.Data.Sqlite ships a native e_sqlite3
      # for both, so this is a one-word change if the host ever moves back to arm64.
      #
      # GET THIS WRONG AND THE FAILURE IS AT RUNTIME, NOT BUILD TIME: the deploy lands successfully and the
      # apphost simply refuses to exec, which reads as a broken release rather than a wrong RID.
      #
      # SELF-CONTAINED on purpose. The runtime rides along in the release, so the host needs no .NET installed
      # and no Microsoft apt repo, and — the real reason — releases/<sha> becomes exactly what that commit ran.
      # With a framework-dependent build, a host runtime upgrade silently changes how every existing release
      # behaves, including the one you roll BACK to in an emergency.
      #
      # Not trimmed and not AOT: MoonSharp resolves script bindings by reflection, which is precisely what the
      # trimmer cannot see. The ~70 MB per app is irrelevant against 200 GB of free block storage.
      - name: Publish (linux-x64, self-contained)
        if: github.event_name != 'pull_request'
        run: |
          dotnet publish Server/Server.csproj           -c Release -r linux-x64 --self-contained true -o out/game
          dotnet publish LoginServer/LoginServer.csproj -c Release -r linux-x64 --self-contained true -o out/login

      # game-data/ ships as part of the release payload. It is only ~12 MB tracked, and shipping it WITH the
      # build keeps a release self-describing: whatever is in releases/<sha>/ is exactly what that commit ran.
      - name: Bundle
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p bundle
          cp -r out/game out/login bundle/
          # Binaries and content ONLY. The systemd units, the deploy script and the backup script used to
          # ride along in this tarball; they now live in Project1998-infra and are checked out on the host
          # at /opt/project1998/infra, so this repo carries nothing host-shaped and a fork's CI has nothing to
          # trip over. The release is still self-describing about the thing it IS: the build and the
          # content that build ran against.
          #
          # The apphosts are what systemd execs now that the build is self-contained. publish sets the
          # executable bit, but tar/scp round-tripping is not worth trusting with the thing that decides
          # whether the server can start at all.
          chmod +x bundle/game/Server bundle/login/LoginServer
          mkdir -p bundle/game-data
          # `git archive HEAD:game-data` ships the committed content subtree and nothing else — no working-tree
          # scratch, no .bak file a content author left lying around. Under the old shared data/ directory this
          # was load-bearing: the working tree there also held project1998.db and chars/. It no longer is — state
          # lives in state/, which this job never even looks at — but it is still the cheapest way to get exactly
          # the committed tree.
          git archive "HEAD:game-data" | tar -x -C bundle/game-data
          # Stamp the content revision INTO the payload. There is no git repo on the host (the release is an
          # unpacked tarball), so this file is the only way the nightly backup can record which content a state
          # snapshot belongs with — and without that pairing a restore is not a point in time. Now that game-data
          # has merged in, the content revision IS the build revision; the file stays because the host reads it.
          git rev-parse HEAD > bundle/game-data/.version
          tar czf p1998-${{ github.sha }}.tar.gz -C bundle .

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: p1998-${{ github.sha }}
          path: p1998-${{ github.sha }}.tar.gz
          retention-days: 14

  # ---------------------------------------------------------------------------------------------
  deploy:
    needs: build
    # Never deploy from a PR, and only from the release branch.
    #
    # DEPLOY_ENABLED is the master switch. Until there is a host to deploy TO, this job must skip rather
    # than run and fail — a permanently-red pipeline teaches you to ignore the pipeline. Set the repository
    # variable to the string "true" once the VPS exists and the DEPLOY_* secrets below are populated:
    #   gh variable set DEPLOY_ENABLED --body true
    # `vars` is one of the few contexts allowed in a job-level `if`; `secrets` is not, which is why the
    # switch is a variable and not a check for the secrets themselves.
    if: >-
      vars.DEPLOY_ENABLED == 'true'
      && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Point this at a GitHub Environment with a required reviewer if you want a manual gate before prod.
    environment: production
    concurrency:
      # Two deploys racing would interleave rsyncs into the same release tree. Queue them instead.
      group: deploy-production
      cancel-in-progress: false
    # What this job's `gh api` calls read: master's tip and the compare (contents), and the superseded check's
    # workflow runs, jobs and job logs (actions). Naming permissions drops every other one to none, and this
    # job uses no other: the artifact download of this same run goes through the runner's own token.
    permissions:
      actions: read
      contents: read
    steps:
      # A SUPERSEDED COMMIT DOES NOT STAGE. The concurrency group runs one deploy at a time, but in the order the
      # deploys reach it, which is the order their builds finish, not the order of the commits. So an older
      # commit whose build ran slower staged over a newer one and moved the game restart booking to itself: a
      # rollback (run 36177648282 staged 84992e9 over 1e95345, run 36183611949 staged fad26aa over cdc2eeb).
      #
      # This step skips everything after it, and ends green with a notice naming the newer commit, only on PROOF
      # that a newer master commit has already staged: that commit's own deploy log holds the host's
      # "staging release <its sha>" and "game restart scheduled" lines, the two the stage step below reads.
      # A newer commit that is still building, queued behind this deploy, failed before staging, cancelled, or
      # content-only (that lane stages no release) proves nothing, so this deploys exactly as before; if that
      # commit stages later it lands on top, which is the right order. Every lookup that fails also deploys,
      # with a warning: a skip must be proven, and an error is not proof. The decision is the one function
      # between the markers below, which Tests/DeployGuard/superseded-guard.test.sh runs against a stubbed gh.
      - name: Skip if a newer commit has already staged
        id: superseded
        # Even a crash here must not block the deploy: with no `skip` output, every later step runs as before.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # >>> superseded-guard
          superseded_guard_unproven() {
            echo "::warning::Superseded check: $1. Deploying as before: a skip needs proof, and a failed lookup is not proof."
          }
          # Sets GUARD_SKIP=true (and GUARD_NEWER) only on proof; every other path leaves it false.
          superseded_guard() {
            GUARD_SKIP=false
            GUARD_NEWER=
            local hex='^[0-9a-f]{40}$' tip cmp status newer runs id head jobs job stage log try
            if ! [[ $SHA =~ $hex ]]; then
              superseded_guard_unproven "this run's commit '$SHA' is not a full SHA"
              return 0
            fi
            # gh prints an API error as ordinary output, so only a full SHA counts as an answer.
            if ! tip=$(gh api "repos/$REPO/commits/master" --jq .sha 2>/dev/null) || ! [[ $tip =~ $hex ]]; then
              superseded_guard_unproven "master's tip could not be read"
              return 0
            fi
            if [ "$tip" = "$SHA" ]; then
              echo "This commit is master's tip, so nothing newer can have staged. Deploying."
              return 0
            fi
            # One call answers both questions: is this commit behind the tip, and which commits are newer. The
            # list stops at 250 commits; a newer commit past that is simply not considered, which only deploys.
            if ! cmp=$(gh api "repos/$REPO/compare/$SHA...$tip" --jq '.status, .commits[].sha' 2>/dev/null); then
              superseded_guard_unproven "the comparison with master's tip $tip failed"
              return 0
            fi
            status=$(head -n 1 <<< "$cmp")
            newer=$(tail -n +2 <<< "$cmp")
            case $status in
              ahead) ;;
              identical|behind|diverged)
                # A dispatch from another ref or a force-moved master: deploy, and the stage step's own
                # "not master's tip" handling stands.
                echo "This commit is not behind master's tip $tip (compare: $status). Deploying as before."
                return 0 ;;
              *)
                superseded_guard_unproven "the comparison with master's tip $tip answered '$status'"
                return 0 ;;
            esac
            if [ -z "$newer" ] || grep -Evq "$hex" <<< "$newer"; then
              superseded_guard_unproven "the commits between this one and master's tip $tip could not be read"
              return 0
            fi
            if ! runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=master&per_page=50" \
                          --jq '.workflow_runs[] | "\(.id) \(.head_sha)"' 2>/dev/null); then
              superseded_guard_unproven "master's workflow runs could not be listed"
              return 0
            fi
            # Newest run first. Only runs of commits newer than this one count.
            while read -r id head <&3; do
              if [ -z "$id" ]; then continue; fi
              if ! [[ $id =~ ^[0-9]+$ && $head =~ $hex ]]; then
                superseded_guard_unproven "a workflow run was listed as '$id $head'"
                return 0
              fi
              if ! grep -Fxq "$head" <<< "$newer"; then continue; fi
              if ! jobs=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                            --jq '.jobs[] | select(.name == "deploy") | "\(.id) \(first(.steps[]? | select(.name == "Stage and schedule") | "\(.status)/\(.conclusion)") // "none")"' \
                            2>/dev/null); then
                superseded_guard_unproven "the jobs of run $id ($head) could not be read"
                return 0
              fi
              job= stage=
              read -r job stage <<< "$jobs"
              # No deploy job yet (still building), queued behind this one, cancelled before it ran, or skipped by
              # this same check: that commit has not staged, so it proves nothing.
              case $stage in
                completed/success|completed/failure|completed/cancelled) ;;
                *) continue ;;
              esac
              if ! [[ $job =~ ^[0-9]+$ ]]; then
                superseded_guard_unproven "the deploy job of run $id ($head) was listed as '$job'"
                return 0
              fi
              # A job's log can lag its completion by a few seconds, and these races are seconds apart.
              log=
              for try in 1 2 3 4 5; do
                if log=$(gh api "repos/$REPO/actions/jobs/$job/logs" --allow-escape-sequences 2>/dev/null); then break; fi
                log=
                if [ "$try" -lt 5 ]; then ${GUARD_SLEEP:-sleep} 3; fi
              done
              if [ -z "$log" ]; then
                superseded_guard_unproven "the deploy log of run $id ($head) could not be read"
                return 0
              fi
              # Host lines only: "<time> [tag] message". The log also echoes this script and the stage step's,
              # which name both phrases, but as "<time> <colour code>..." lines with no SHA after either one.
              if grep -Eq "^[^ ]+ \[[^]]*\] staging release $head[[:space:]]*\$" <<< "$log" \
                 && grep -Eq '^[^ ]+ \[[^]]*\] game restart scheduled' <<< "$log"; then
                GUARD_SKIP=true
                GUARD_NEWER=$head
                echo "::notice::Superseded: $head is newer than $SHA on master, and its deploy (run $id) has already put its release on the host. Skipped this upload and stage so production is not rolled back to $SHA."
                return 0
              fi
            done 3<<< "$runs"
            echo "No master commit newer than this one has staged its release. Deploying."
          }
          # <<< superseded-guard
          superseded_guard || true
          echo "skip=$GUARD_SKIP" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: steps.superseded.outputs.skip != 'true'
        with:
          name: p1998-${{ github.sha }}

      - name: Set up SSH
        if: steps.superseded.outputs.skip != 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key rather than StrictHostKeyChecking=no — otherwise the deploy will happily hand
          # the server's binaries to whatever answers on that IP.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload the release
        if: steps.superseded.outputs.skip != 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -P "${{ secrets.DEPLOY_PORT || 22 }}" \
            "p1998-${{ github.sha }}.tar.gz" "$USER@$HOST:/tmp/"

      # host-deploy.sh lives in Project1998-infra, checked out on the host at /opt/project1998/infra, and is
      # invoked BY PATH rather than piped in over stdin. That inversion is what keeps this repo free of
      # host-shaped files: CI's job ends at "here is a tarball", and how the host installs it is the infra
      # repo's business, updated on its own cadence with `git -C /opt/project1998/infra pull`.
      #
      # ONE TOLERATED FAILURE. For a code change the script stages the release, points `current` at it, books the
      # game restart (a later booking replaces an earlier one: Server/RestartSchedule.cs, Schedule), and only then
      # arms the login restart as a transient systemd timer, p1998-login-re*.timer. That timer stays loaded until it
      # fires, DELAY minutes after the PREVIOUS deploy, so a deploy inside that window fails right there with
      # "Unit ... was already loaded or has a fragment file" (runs 35363844440, 35671983710, 35890937712). By then
      # everything that matters has happened: the pending timer restarts login into `current`, which is already
      # this release, and the game restarts once, on this deploy's booking. Players get one restart for the burst
      # and production ends on the newest build. (Login does run the newer build for up to DELAY minutes before the
      # game restarts onto it; that was so before this step and this step does not change it.) So this step passes
      # on exactly that failure, with a warning, when the output shows THIS commit staged and the game restart
      # booked, and this commit is master's tip. Anything else stays red, including a collision by a commit that
      # is not the tip: that may be an older build staged over a newer one (run 35890937712 staged 413bc198 over
      # ed6c7f16), a rollback someone has to see. The tolerated case skips only the script's tail -- "login
      # restart armed" and the pruning of old releases -- which the next clean deploy does.
      - name: Stage and schedule
        if: steps.superseded.outputs.skip != 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DELAY: ${{ github.event.inputs.restart_delay_minutes || '3' }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          ssh -p "${{ secrets.DEPLOY_PORT || 22 }}" "$USER@$HOST" \
            "bash /opt/project1998/infra/scripts/host-deploy.sh $SHA '$DELAY' ${{ needs.build.outputs.code_changed }}" \
            2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi

          last=$(grep -v '^[[:space:]]*$' deploy.log | tail -n 1 || true)
          collided=false
          if printf '%s\n' "$last" | grep -Eq '^Failed to start transient timer unit: Unit p1998-login-re[A-Za-z0-9_.@-]*\.timer was already loaded' \
             && grep -Fq "staging release $SHA" deploy.log \
             && grep -Fq 'game restart scheduled' deploy.log \
             && ! grep -Fq 'login restart armed' deploy.log; then
            collided=true
          fi
          if [ "$collided" != true ]; then exit "$status"; fi

          # A failed lookup leaves the run red, as it was before this step existed. gh prints an API error as
          # ordinary output, so only a full SHA counts as an answer.
          tip=$(gh api "repos/$REPO/commits/master" --jq .sha 2>/dev/null || true)
          if ! printf '%s' "$tip" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Collided with the pending login restart, and master's tip could not be read."
            exit "$status"
          fi
          if [ "$tip" != "$SHA" ]; then
            echo "::error::Collided with the pending login restart, and this commit is not master's tip ($tip): it may have staged an older build than production had. Check what is running before the next deploy."
            exit "$status"
          fi
          echo "::warning::The previous deploy's login restart is still pending, so this deploy could not arm its own. It staged $SHA and moved the game restart booking to it; the pending timer restarts login into the same release. Old releases were not pruned this time."
